name: 插件问题反馈
description: 装不上、报错、拦截不对。带上下面这些信息，我们才能定位问题。
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        急着解决的话，直接进**官方 QQ 群 439392221** 问更快（群里发截图、发日志都方便）。

        这里请尽量填全 —— 少了系统版本和报错原文，多半只能回你一句「发一下报错」。
        提交前麻烦确认没有把**接口密钥、数据库密码**贴进来。

  - type: input
    id: plugin
    attributes:
      label: 哪个插件、什么版本
      placeholder: 例如「公共黑名单 1.4」（后台「插件管理」列表里能看到版本号）
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: 易支付系统版本
      placeholder: 例如「彩虹易支付 PRO v6.x」（后台首页/关于里能看到）
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 服务器环境
      placeholder: PHP 8.2 / MySQL 8.0 / 宝塔 + Nginx / Swoole 守护进程（或「访问URL」型计划任务）
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 你做了什么、期望什么、实际什么
      value: |
        1. 我点了 / 我改了：
        2. 期望：
        3. 实际：
      placeholder: 步骤越具体越好，能复现的步骤是最有用的
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 报错原文 / 截图
      description: |
        后台弹出来的提示、插件页那一行状态、系统日志里的记录，**原样**贴上来，别自己改措辞。
        截图直接拖进来就行。
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 还想说点什么（可选）
      description: 比如「以前是好的，升级完就这样了」「另一个站装同一个版本没问题」
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 先确认一下
      options:
        - label: 我看过这个插件自带的 README（安装、配置、常见问题都在里面）
          required: true
        - label: 如果这是「连接不通」类的问题，我已经点过「测一下连接」
          required: false
        - label: 我贴的内容里没有接口密钥、数据库密码等敏感信息
          required: true
